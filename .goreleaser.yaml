version: 2

# Pinned explicitly: GoReleaser otherwise derives this from go.mod's last
# path segment ("v2"). Release assets must be named rdflow-<os>-<arch>.* and
# rdflow_<version>_checksums.txt, which install.sh and `rdflow update` expect.
project_name: rdflow

before:
  hooks:
    - mkdir -p completions
    - sh -c "go run ./cmd/redmine completion bash > completions/rdflow.bash"
    - sh -c "go run ./cmd/redmine completion zsh > completions/rdflow.zsh"
    - sh -c "go run ./cmd/redmine completion fish > completions/rdflow.fish"

builds:
  - binary: rdflow
    main: ./cmd/redmine
    # Fully static binaries. Without this, the native linux/amd64 build on the
    # Ubuntu runner links against glibc, which breaks on musl distros and in
    # the distroless MCP image. Nothing in the dependency tree needs cgo.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*

# Publish an SPDX JSON software bill of materials for every release archive.
# GoReleaser invokes Syft for this step; the release workflow installs a pinned
# Syft version before running GoReleaser.
sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: TruthUnderlier
    name: RedmineFlow
  # Tags with a pre-release suffix (v10.1.0-rc.1) become GitHub prereleases,
  # which /releases/latest, `rdflow update` and install.sh never pick.
  prerelease: auto

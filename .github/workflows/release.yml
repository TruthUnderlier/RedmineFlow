name: Release

# Installed updaters only install a release whose archives carry a
# GitHub artifact attestation signed by THIS workflow file running for the
# release tag: the certificate identity is pinned to
#   https://github.com/TruthUnderlier/RedmineFlow/.github/workflows/release.yml@refs/tags/<tag>
# (internal/cmd/update/attestation.go). Renaming or moving this file,
# transferring the repository, or releasing from anything but a v* tag push
# makes every installed updater refuse new releases, short of
# --skip-attestation. TestReleaseWorkflowMatchesPinnedSigner guards this.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # No build cache: a poisoned cache entry would end up in the published
      # binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.50.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact version: a floating range would pick up a new (possibly
          # compromised) GoReleaser release mid-flight. Keep in sync with
          # ci.yml; Renovate bumps both via the custom manager.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate release checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -maxdepth 1 -type f -name 'rdflow_*_checksums.txt' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release checksum file, found ${#files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

  # Proves that installed updaters accept the release just published: the
  # archives are downloaded back from the release, checked against its
  # checksums, verified with gh against the exact identity the updater pins,
  # and finally verified by the updater's own Go verifier.
  #
  # If this job fails, the release is public without a usable attestation and
  # `rdflow update` refuses it. If it is a transient API error,
  # re-run this job. Otherwise delete the release but keep the tag
  # (gh release delete <tag> --yes) and re-run all jobs of this workflow run,
  # which rebuilds, re-uploads and re-attests it.
  verify-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release-assets"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'rdflow*' --dir "$dir"
          cd "$dir"
          sha256sum -c --ignore-missing "rdflow_${GITHUB_REF_NAME#v}_checksums.txt"
          for f in rdflow-*.tar.gz rdflow-*.zip; do
            grep -q "  ${f}\$" "rdflow_${GITHUB_REF_NAME#v}_checksums.txt" || { echo "::error::${f} is missing from the checksums file"; exit 1; }
          done

      - name: Verify attestations with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          for f in "${RUNNER_TEMP}"/release-assets/rdflow-*.tar.gz "${RUNNER_TEMP}"/release-assets/rdflow-*.zip; do
            gh attestation verify "$f" --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "$identity" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/${GITHUB_REF_NAME}" \
              --predicate-type https://slsa.dev/provenance/v1
          done

      - name: Verify attestations with the updater's verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REDMINE_RELEASE_TAG="${GITHUB_REF_NAME}" \
          REDMINE_RELEASE_ASSETS="${RUNNER_TEMP}/release-assets" \
            go test -tags releaselive ./internal/cmd/update -run TestReleaseAttestationLive -count=1 -v

  # Comments on every issue that a PR in this release closed, linking the
  # version that ships the fix. Stable releases only, counted from the previous
  # stable tag, so fixes from an rc cycle are announced once with the final
  # version. The marker makes re-runs skip issues that were already notified.
  #
  # A failure here does not affect the release itself; re-running only this
  # job is safe.
  notify-issues:
    needs: verify-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comment on resolved issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${tag}^")
          echo "Issues closed between ${prev} and ${tag}:"

          # shellcheck disable=SC2016 # GraphQL variables, not shell
          query='query($owner: String!, $repo: String!, $oid: GitObjectID!) {
            repository(owner: $owner, name: $repo) {
              object(oid: $oid) {
                ... on Commit {
                  associatedPullRequests(first: 5) {
                    nodes {
                      number
                      merged
                      closingIssuesReferences(first: 25) {
                        nodes { number state repository { nameWithOwner } }
                      }
                    }
                  }
                }
              }
            }
          }'

          # One "<issue> <pr>" line per same-repo issue a merged PR in the range
          # closed and that is still closed (not reopened after a failed fix).
          # `|| exit 1` because errexit does not reach into the subshell, so a
          # failed call would otherwise silently drop that commit's issues.
          # shellcheck disable=SC2016 # jq variable, not shell
          pairs=$(git rev-list "${prev}..${tag}" | while read -r sha; do
            gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F oid="$sha" -f query="$query" \
              --jq '.data.repository.object.associatedPullRequests.nodes[]
                | select(.merged) | .number as $pr
                | .closingIssuesReferences.nodes[]
                | select(.repository.nameWithOwner == env.GITHUB_REPOSITORY and .state == "CLOSED")
                | "\(.number) \($pr)"' || exit 1
          done | sort -k1,1n -k2,2n -u)

          if [ -z "$pairs" ]; then
            echo "none"
            exit 0
          fi

          marker="<!-- released-in: ${tag} -->"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          failed=0
          for issue in $(cut -d' ' -f1 <<<"$pairs" | uniq); do
            prs=$(awk -v i="$issue" '$1 == i { printf "%s#%s", (n++ ? ", " : ""), $2 }' <<<"$pairs")
            # Read all comments first: piping into `grep -q` could kill gh with
            # SIGPIPE mid-pagination, which pipefail would turn into "not found".
            if ! bodies=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments?per_page=100" --paginate --jq '.[].body'); then
              echo "::warning::could not read comments on #${issue}"
              failed=1
              continue
            fi
            if grep -qF "$marker" <<<"$bodies"; then
              echo "#${issue}: already notified"
              continue
            fi
            body="This is now available in [${tag}](${url}) via ${prs}. To update, run \`rdflow update\`.

          ${marker}"
            # A locked or deleted issue must not stop the others from being notified.
            if gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; then
              echo "#${issue}: notified (${prs})"
            else
              echo "::warning::could not comment on #${issue}"
              failed=1
            fi
          done
          exit "$failed"
